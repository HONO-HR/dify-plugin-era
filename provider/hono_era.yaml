identity:
  author: hono
  name: hono_era
  label:
    en_US: ERA by HONO
  description:
    en_US: Use HONO HRMS from Dify with your own ERA access. Read leave, attendance, pay, team, performance, learning, hiring and policy data, and apply, approve or cancel requests after a confirmation step.
  icon: icon.png
  tags:
    - business
    - productivity
oauth_schema:
  # The plugin registers itself with HONO, so the client form stays blank. Dify only
  # starts OAuth once a workspace admin has saved this form once.
  client_schema:
    - name: note
      type: text-input
      required: false
      label:
        en_US: Nothing to fill in
      help:
        en_US: Leave blank and click Save. ERA by HONO registers itself with HONO; no client ID or secret is needed.
  credentials_schema:
    - name: access_token
      type: secret-input
      label:
        en_US: Access token
    - name: refresh_token
      type: secret-input
      label:
        en_US: Refresh token
    - name: client_id
      type: text-input
      label:
        en_US: Client ID
credentials_for_provider:
  mcp_url:
    type: text-input
    required: true
    label:
      en_US: ERA MCP URL
    placeholder:
      en_US: https://yourcompany.hono.ai/api/yourcompany/mcp
    help:
      en_US: In ERA, open Profile > MCP keys and copy the MCP URL shown there.
  api_key:
    type: secret-input
    required: true
    label:
      en_US: ERA MCP API key
    placeholder:
      en_US: hno_live_...
    help:
      en_US: Create a key in ERA under Profile > MCP keys. Leave "Everyday HR tools only" unticked to use all tools. Tick "Read-only" if this Dify app should only read data. Your HONO administrator must have MCP access enabled.
