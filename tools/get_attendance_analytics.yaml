identity:
  name: "get_attendance_analytics"
  author: hono
  label:
    en_US: "Get Attendance Analytics"
description:
  human:
    en_US: "Provides attendance pattern aggregates like present, absent, late counts over a date range for the organization or department."
  llm: "Provides attendance pattern aggregates like present, absent, late counts over a date range for the organization or department."
parameters:
  - name: "startDate"
    type: string
    required: false
    form: llm
    label:
      en_US: "startDate"
    human_description:
      en_US: "Start date (YYYY-MM-DD). Default: 90 days ago. Pass the full range the user asked for."
    llm_description: "Start date (YYYY-MM-DD). Default: 90 days ago. Pass the full range the user asked for."
  - name: "endDate"
    type: string
    required: false
    form: llm
    label:
      en_US: "endDate"
    human_description:
      en_US: "End date (YYYY-MM-DD). Default: today."
    llm_description: "End date (YYYY-MM-DD). Default: today."
  - name: "isAsOfDate"
    type: boolean
    required: false
    form: llm
    label:
      en_US: "isAsOfDate"
    human_description:
      en_US: "If true, show snapshot as of endDate only. Default: false (range)."
    llm_description: "If true, show snapshot as of endDate only. Default: false (range)."
extra:
  python:
    source: tools/get_attendance_analytics.py
