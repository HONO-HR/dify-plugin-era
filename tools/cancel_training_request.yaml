identity:
  name: "cancel_training_request"
  author: hono
  label:
    en_US: "Cancel Training Request"
description:
  human:
    en_US: "Cancels the employee's LMS training request, requiring confirmation. Cannot cancel if already actioned by an approver."
  llm: "Cancels the employee's LMS training request, requiring confirmation. Cannot cancel if already actioned by an approver."
parameters:
  - name: "request"
    type: string
    required: false
    form: llm
    label:
      en_US: "request"
    human_description:
      en_US: "Which request to cancel - the learning/course name or the request id from the chooser. Omit to list."
    llm_description: "Which request to cancel - the learning/course name or the request id from the chooser. Omit to list."
  - name: "remarks"
    type: string
    required: false
    form: llm
    label:
      en_US: "remarks"
    human_description:
      en_US: "Optional cancellation reason."
    llm_description: "Optional cancellation reason."
  - name: "confirm"
    type: string
    required: false
    form: llm
    label:
      en_US: "confirm"
    human_description:
      en_US: "Pass \"true\" ONLY after the user explicitly confirmed the staged cancellation."
    llm_description: "Pass \"true\" ONLY after the user explicitly confirmed the staged cancellation."
  - name: "confirmToken"
    type: string
    required: false
    form: llm
    label:
      en_US: "confirmToken"
    human_description:
      en_US: "Leave empty on the first call. Pass the token from the confirmation_required result, after the user confirms, to perform the action."
    llm_description: "Leave empty on the first call. Pass the token from the confirmation_required result, after the user confirms, to perform the action."
extra:
  python:
    source: tools/cancel_training_request.py
