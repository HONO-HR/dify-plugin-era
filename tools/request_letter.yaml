identity:
  name: "request_letter"
  author: hono
  label:
    en_US: "Request Letter"
description:
  human:
    en_US: "Generates a filled letter for the employee by template name, checking eligibility first. Returns the formatted letter if eligible."
  llm: "Generates a filled letter for the employee by template name, checking eligibility first. Returns the formatted letter if eligible."
parameters:
  - name: "templateName"
    type: string
    required: true
    form: llm
    label:
      en_US: "templateName"
    human_description:
      en_US: "Name of the letter template (e.g. \"Experience Certificate\"). Case-insensitive partial match supported but exact match is preferred."
    llm_description: "Name of the letter template (e.g. \"Experience Certificate\"). Case-insensitive partial match supported but exact match is preferred."
  - name: "confirmToken"
    type: string
    required: false
    form: llm
    label:
      en_US: "confirmToken"
    human_description:
      en_US: "Leave empty on the first call. Pass the token from the confirmation_required result, after the user confirms, to perform the action."
    llm_description: "Leave empty on the first call. Pass the token from the confirmation_required result, after the user confirms, to perform the action."
extra:
  python:
    source: tools/request_letter.py
