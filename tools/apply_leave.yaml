identity:
  name: "apply_leave"
  author: hono
  label:
    en_US: "Apply Leave"
description:
  human:
    en_US: "Submits a leave application for the current user, requiring leave type, dates, and reason, and goes for approval."
  llm: "Submits a leave application for the current user, requiring leave type, dates, and reason, and goes for approval."
parameters:
  - name: "lvType"
    type: string
    required: false
    form: llm
    label:
      en_US: "lvType"
    human_description:
      en_US: "Leave type ID (LvTypeId from the leave balance list). Required to submit."
    llm_description: "Leave type ID (LvTypeId from the leave balance list). Required to submit."
  - name: "fromDate"
    type: string
    required: false
    form: llm
    label:
      en_US: "fromDate"
    human_description:
      en_US: "Leave start date in STRICT YYYY-MM-DD format. The MIDDLE component is the MONTH (01-12). Example: April 9, 2026 = \"2026-04-09\" (NOT \"2026-09-04\" - that would be Sept 4)."
    llm_description: "Leave start date in STRICT YYYY-MM-DD format. The MIDDLE component is the MONTH (01-12). Example: April 9, 2026 = \"2026-04-09\" (NOT \"2026-09-04\" - that would be Sept 4)."
  - name: "toDate"
    type: string
    required: false
    form: llm
    label:
      en_US: "toDate"
    human_description:
      en_US: "Leave end date in STRICT YYYY-MM-DD format. Same month-position rule as fromDate."
    llm_description: "Leave end date in STRICT YYYY-MM-DD format. Same month-position rule as fromDate."
  - name: "fromType"
    type: string
    required: false
    form: llm
    label:
      en_US: "fromType"
    human_description:
      en_US: "Start day type: \"full\", \"first half\", \"second half\" (default: full)"
    llm_description: "Start day type: \"full\", \"first half\", \"second half\" (default: full)"
  - name: "toType"
    type: string
    required: false
    form: llm
    label:
      en_US: "toType"
    human_description:
      en_US: "End day type: \"full\", \"first half\", \"second half\" (default: full)"
    llm_description: "End day type: \"full\", \"first half\", \"second half\" (default: full)"
  - name: "reason"
    type: string
    required: false
    form: llm
    label:
      en_US: "reason"
    human_description:
      en_US: "Reason for leave (required to submit)"
    llm_description: "Reason for leave (required to submit)"
  - name: "forceCreate"
    type: boolean
    required: false
    form: llm
    label:
      en_US: "forceCreate"
    human_description:
      en_US: "Set to true to skip duplicate-detection and submit anyway. Only set after the user has explicitly confirmed they want to submit despite an existing pending overlap."
    llm_description: "Set to true to skip duplicate-detection and submit anyway. Only set after the user has explicitly confirmed they want to submit despite an existing pending overlap."
  - name: "confirmToken"
    type: string
    required: false
    form: llm
    label:
      en_US: "confirmToken"
    human_description:
      en_US: "Leave empty on the first call. Pass the token from the confirmation_required result, after the user confirms, to perform the action."
    llm_description: "Leave empty on the first call. Pass the token from the confirmation_required result, after the user confirms, to perform the action."
extra:
  python:
    source: tools/apply_leave.py
