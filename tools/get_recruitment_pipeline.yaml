identity:
  name: "get_recruitment_pipeline"
  author: hono
  label:
    en_US: "Get Recruitment Pipeline"
description:
  human:
    en_US: "Provides recruitment pipeline details per job requisition, including position title, location, status, and application stages."
  llm: "Provides recruitment pipeline details per job requisition, including position title, location, status, and application stages."
parameters:
  - name: "page"
    type: number
    required: false
    form: llm
    label:
      en_US: "page"
    human_description:
      en_US: "Page number, 1-based. Default 1."
    llm_description: "Page number, 1-based. Default 1."
  - name: "pageSize"
    type: number
    required: false
    form: llm
    label:
      en_US: "pageSize"
    human_description:
      en_US: "Jobs per page. Default 25, maximum 100."
    llm_description: "Jobs per page. Default 25, maximum 100."
  - name: "status"
    type: string
    required: false
    form: llm
    label:
      en_US: "status"
    human_description:
      en_US: "Requisition status: \"open\" (default, excludes closed, rejected, cancelled, draft and on hold), \"all\", or a status name such as \"published\" or \"approved\"."
    llm_description: "Requisition status: \"open\" (default, excludes closed, rejected, cancelled, draft and on hold), \"all\", or a status name such as \"published\" or \"approved\"."
  - name: "onlyMine"
    type: boolean
    required: false
    form: llm
    label:
      en_US: "onlyMine"
    human_description:
      en_US: "true = only requisitions the user created (hiring manager) or is assigned to as recruiter."
    llm_description: "true = only requisitions the user created (hiring manager) or is assigned to as recruiter."
  - name: "sort"
    type: string
    required: false
    form: llm
    label:
      en_US: "sort"
    human_description:
      en_US: "\"newest\" (default, most recently opened first) or \"oldest\" (longest open first)."
    llm_description: "\"newest\" (default, most recently opened first) or \"oldest\" (longest open first)."
extra:
  python:
    source: tools/get_recruitment_pipeline.py
