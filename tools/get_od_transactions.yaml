identity:
  name: "get_od_transactions"
  author: hono
  label:
    en_US: "Get OD Transactions"
description:
  human:
    en_US: "Returns out-on-duty request history for the employee or their team, filterable by status and date range, with dates, reason and approval status."
  llm: "Returns out-on-duty request history for the employee or their team, filterable by status and date range, with dates, reason and approval status."
parameters:
  - name: "dataSource"
    type: string
    required: false
    form: llm
    label:
      en_US: "dataSource"
    human_description:
      en_US: "Whose OD to show. \"myself\" = self, \"team\"/\"approval\" = for approval/team, \"all\" = all. Default: myself."
    llm_description: "Whose OD to show. \"myself\" = self, \"team\"/\"approval\" = for approval/team, \"all\" = all. Default: myself."
  - name: "status"
    type: string
    required: false
    form: llm
    label:
      en_US: "status"
    human_description:
      en_US: "Filter by status"
    llm_description: "Filter by status"
  - name: "fromDate"
    type: string
    required: false
    form: llm
    label:
      en_US: "fromDate"
    human_description:
      en_US: "Start date filter (YYYY-MM-DD)"
    llm_description: "Start date filter (YYYY-MM-DD)"
  - name: "toDate"
    type: string
    required: false
    form: llm
    label:
      en_US: "toDate"
    human_description:
      en_US: "End date filter (YYYY-MM-DD)"
    llm_description: "End date filter (YYYY-MM-DD)"
  - name: "page"
    type: number
    required: false
    form: llm
    label:
      en_US: "page"
    human_description:
      en_US: "Page number (default 1)"
    llm_description: "Page number (default 1)"
  - name: "pageSize"
    type: number
    required: false
    form: llm
    label:
      en_US: "pageSize"
    human_description:
      en_US: "Results per page (default 10)"
    llm_description: "Results per page (default 10)"
extra:
  python:
    source: tools/get_od_transactions.py
