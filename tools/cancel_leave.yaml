identity:
  name: "cancel_leave"
  author: hono
  label:
    en_US: "Cancel Leave"
description:
  human:
    en_US: "Cancels a pending leave request for the user, listing cancellable leaves before confirming cancellation."
  llm: "Cancels a pending leave request for the user, listing cancellable leaves before confirming cancellation."
parameters:
  - name: "fromDate"
    type: string
    required: false
    form: llm
    label:
      en_US: "fromDate"
    human_description:
      en_US: "Leave start date in STRICT YYYY-MM-DD format (from the pending leave record). Middle component is the MONTH (01-12). Copy exactly from the fromDate field returned by Step 1."
    llm_description: "Leave start date in STRICT YYYY-MM-DD format (from the pending leave record). Middle component is the MONTH (01-12). Copy exactly from the fromDate field returned by Step 1."
  - name: "toDate"
    type: string
    required: false
    form: llm
    label:
      en_US: "toDate"
    human_description:
      en_US: "Leave end date in STRICT YYYY-MM-DD format (from the pending leave record). Copy exactly from the toDate field returned by Step 1."
    llm_description: "Leave end date in STRICT YYYY-MM-DD format (from the pending leave record). Copy exactly from the toDate field returned by Step 1."
  - name: "confirmToken"
    type: string
    required: false
    form: llm
    label:
      en_US: "confirmToken"
    human_description:
      en_US: "Leave empty on the first call. Pass the token from the confirmation_required result, after the user confirms, to perform the action."
    llm_description: "Leave empty on the first call. Pass the token from the confirmation_required result, after the user confirms, to perform the action."
extra:
  python:
    source: tools/cancel_leave.py
