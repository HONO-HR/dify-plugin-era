identity:
  name: "cancel_ar"
  author: hono
  label:
    en_US: "Cancel AR"
description:
  human:
    en_US: "Cancels a previously submitted attendance regularisation request for the user. Requires AR request ID."
  llm: "Cancels a previously submitted attendance regularisation request for the user. Requires AR request ID."
parameters:
  - name: "markPastId"
    type: number
    required: true
    form: llm
    label:
      en_US: "markPastId"
    human_description:
      en_US: "The AR request ID (markPastId) to cancel"
    llm_description: "The AR request ID (markPastId) to cancel"
  - name: "remark"
    type: string
    required: false
    form: llm
    label:
      en_US: "remark"
    human_description:
      en_US: "Optional remark for cancellation"
    llm_description: "Optional remark for cancellation"
  - name: "confirmToken"
    type: string
    required: false
    form: llm
    label:
      en_US: "confirmToken"
    human_description:
      en_US: "Leave empty on the first call. Pass the token from the confirmation_required result, after the user confirms, to perform the action."
    llm_description: "Leave empty on the first call. Pass the token from the confirmation_required result, after the user confirms, to perform the action."
extra:
  python:
    source: tools/cancel_ar.py
